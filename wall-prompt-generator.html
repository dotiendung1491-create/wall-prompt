<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Reinforcement Prompt Generator</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--text:#1d2733;--muted:#5f6b7a;--line:#d5dbe3;--accent:#0b5cad;--ok:#17693a;--okbg:#e3f4ea;--err:#a4261c;--errbg:#fbe9e7}
  @media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d232a;--text:#e6ebf0;--muted:#9aa6b4;--line:#323b46;--accent:#5aa3ee;--ok:#7fd8a0;--okbg:#17301f;--err:#ff9d94;--errbg:#3a1c19}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--muted);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
  .invalid{border-color:var(--err)!important}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .field{margin-bottom:12px}
  .group{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
  .group.off{opacity:.55}
  .group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600}
  .group-head input{width:auto}
  .group-head span small{font-weight:400;color:var(--muted)}
  .group .row{margin-bottom:0}
  .err{color:var(--err);font-size:12px;min-height:0;margin-top:2px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  button{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  textarea{min-height:430px;font:13px/1.5 Consolas,Menlo,monospace;resize:vertical;white-space:pre}
  textarea[readonly]{opacity:.9}
  .msg{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:14px;display:none}
  .msg.ok{display:block;background:var(--okbg);color:var(--ok)}
  .msg.bad{display:block;background:var(--errbg);color:var(--err)}
  .mode{color:var(--muted);font-size:13px;margin-left:auto;align-self:center}
</style>
</head>
<body>
<main>
  <h1>Wall Reinforcement Prompt Generator</h1>
  <p class="sub">Fill in the parameters, generate the prompt, copy it, and paste it into Claude Code. No Allplan connection needed.</p>

  <div class="grid">
    <section class="card">
      <h2>Parameters</h2>
      <form id="form" novalidate autocomplete="off">
        <div class="field">
          <label for="object_name">Wall name (Object_name) *</label>
          <input id="object_name" placeholder="e.g. W01">
          <div class="err" data-err="object_name"></div>
        </div>
        <div class="row">
          <div><label for="cv">Concrete cover cv (mm) *</label><input id="cv" type="number" step="any" min="1" value="25"><div class="err" data-err="cv"></div></div>
          <div><label for="concrete_grade">Concrete grade *</label><select id="concrete_grade"><option>C16/20</option><option>C20/25</option><option>C25/30</option><option selected>C30/37</option><option>C35/45</option><option>C40/50</option><option>C45/55</option><option>C50/60</option><option>C55/67</option><option>C60/75</option></select><div class="err" data-err="concrete_grade"></div></div>
        </div>
        <div class="field">
          <label for="reinforcement_steel_grade">Reinforcement steel grade *</label>
          <select id="reinforcement_steel_grade"><option value="B500A">B500A</option><option value="B500B" selected>B500B</option></select>
          <div class="err" data-err="reinforcement_steel_grade"></div>
        </div>

        <h2 style="margin-top:18px">Reinforcement groups</h2>
        <div id="groups"></div>

        <div class="btns">
          <button type="button" class="primary" id="btnGenerate">Generate Prompt</button>
          <button type="button" id="btnReset">Reset Form</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Prompt</h2>
      <textarea id="prompt" readonly placeholder="Click “Generate Prompt” to build the prompt here."></textarea>
      <div class="btns">
        <button type="button" class="primary" id="btnCopy" disabled>Copy Prompt</button>
        <button type="button" id="btnEdit" disabled>Edit Prompt</button>
        <span class="mode" id="mode">Preview mode</span>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </section>
  </div>
</main>

<script>
/* ===== Configuration (edit here) ===== */
const DIAMETERS = [6, 8, 10, 12, 14, 16, 20, 25, 28, 32];

// Optional groups. spacing:false => diameter only.
const GROUPS = [
  { key:'HR',  label:'Horizontal reinforcement (HR)',                         spacing:true,  d:12, s:200 },
  { key:'VR',  label:'Vertical reinforcement (VR)',                           spacing:true,  d:12, s:200 },
  { key:'PIN', label:'U-stirrups / Pins (PIN)',                               spacing:true,  d:8,  s:200 },
  { key:'CS',  label:'Closed stirrups (CS) at narrow wall strips',            spacing:true,  d:8,  s:150 },
  { key:'ER',  label:'Edge/corner reinforcement (ER)',                        spacing:false, d:12 },
  { key:'HB',  label:'Hook bars connecting both reinforcement layers (HB)',   spacing:true,  d:8,  s:400 },
];
const SPACING_MIN = 25, SPACING_MAX = 500;

// Prompt template. {{GROUP_LINES}} is replaced by the group lines below.
const PROMPT_TEMPLATE =
`Generate all reinforcement for the in-situ wall
with Object_name = {{Object_name}}

Concrete cover (cv): {{cv}} mm
Concrete grade: {{concrete_grade}}
Reinforcement steel grade: {{reinforcement_steel_grade}}

{{GROUP_LINES}}`;

// Line format per group; edit wording here.
function groupLine(g, v){
  if(!v.on) return `${g.label}: EXCLUDED - do not generate this reinforcement`;
  return g.spacing
    ? `${g.label}: Ø${v.d} @${v.s} mm`
    : `${g.label}: Ø${v.d}`;
}
/* ===== End configuration ===== */

const $ = id => document.getElementById(id);
const fillTemplate = (tpl, map) => tpl.replace(/\{\{(\w+)\}\}/g, (m,k)=> k in map ? map[k] : m);

// Build group UI
const groupsEl = $('groups');
GROUPS.forEach(g=>{
  const opts = DIAMETERS.map(d=>`<option value="${d}">Ø${d}</option>`).join('');
  const div = document.createElement('div');
  div.className='group'; div.id='g_'+g.key;
  div.innerHTML = `
    <div class="group-head"><input type="checkbox" id="${g.key}_on" checked aria-label="Include ${g.key}">
      <label for="${g.key}_on" style="margin:0;color:inherit;font-size:14px">${g.label}</label></div>
    <div class="row">
      <div><label for="${g.key}_d">Diameter</label><select id="${g.key}_d">${opts}</select></div>
      ${g.spacing?`<div><label for="${g.key}_s">Spacing (mm)</label><input id="${g.key}_s" type="number" step="any" min="${SPACING_MIN}" max="${SPACING_MAX}"><div class="err" data-err="${g.key}_s"></div></div>`:''}
    </div>`;
  groupsEl.appendChild(div);
  $(g.key+'_on').addEventListener('change',()=>syncGroup(g));
});
function syncGroup(g){
  const on = $(g.key+'_on').checked;
  $('g_'+g.key).classList.toggle('off',!on);
  $(g.key+'_d').disabled = !on;
  if(g.spacing) $(g.key+'_s').disabled = !on;
}
function setDefaults(){
  $('object_name').value=''; $('cv').value=25;
  $('concrete_grade').value='C30/37'; $('reinforcement_steel_grade').value='B500B';
  GROUPS.forEach(g=>{
    $(g.key+'_on').checked=true; $(g.key+'_d').value=g.d;
    if(g.spacing) $(g.key+'_s').value=g.s;
    syncGroup(g);
  });
}

// Validation
function setErr(id,text){
  const el=document.querySelector(`[data-err="${id}"]`); if(el) el.textContent=text||'';
  const inp=$(id); if(inp) inp.classList.toggle('invalid',!!text);
}
function validate(){
  let ok=true; const bad=(id,t)=>{setErr(id,t);ok=false;};
  ['object_name','cv','concrete_grade','reinforcement_steel_grade'].forEach(id=>setErr(id,''));
  GROUPS.forEach(g=>g.spacing&&setErr(g.key+'_s',''));
  if(!$('object_name').value.trim()) bad('object_name','Wall name is required.');
  const cv=parseFloat($('cv').value);
  if(!(cv>0)) bad('cv','Enter a cover greater than 0.');
  if(!$('concrete_grade').value.trim()) bad('concrete_grade','Required.');
  if(!$('reinforcement_steel_grade').value.trim()) bad('reinforcement_steel_grade','Required.');
  let enabled=0;
  GROUPS.forEach(g=>{
    if(!$(g.key+'_on').checked) return;
    enabled++;
    if(g.spacing){
      const s=parseFloat($(g.key+'_s').value);
      if(!(s>0)) bad(g.key+'_s','Spacing required.');
      else if(s<SPACING_MIN||s>SPACING_MAX) bad(g.key+'_s',`Must be ${SPACING_MIN}-${SPACING_MAX} mm.`);
    }
  });
  if(!enabled){ ok=false; showMsg('Enable at least one reinforcement group.',false); }
  return ok;
}

// Prompt build
function buildPrompt(){
  const lines = GROUPS.map(g=>groupLine(g,{
    on:$(g.key+'_on').checked, d:$(g.key+'_d').value, s:g.spacing?parseFloat($(g.key+'_s').value):null
  }));
  return fillTemplate(PROMPT_TEMPLATE,{
    Object_name:$('object_name').value.trim(),
    cv:parseFloat($('cv').value),
    concrete_grade:$('concrete_grade').value.trim(),
    reinforcement_steel_grade:$('reinforcement_steel_grade').value.trim(),
    GROUP_LINES:lines.join('\n'),
  });
}

// UI state
const promptEl=$('prompt');
function showMsg(t,ok){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'bad');}
function clearMsg(){$('msg').className='msg';}
function setEditing(on){
  promptEl.readOnly=!on;
  $('btnEdit').textContent=on?'Preview Prompt':'Edit Prompt';
  $('mode').textContent=on?'Edit mode - changes are copied':'Preview mode';
  if(on) promptEl.focus();
}

$('btnGenerate').onclick=()=>{
  clearMsg();
  if(!validate()) return;
  promptEl.value=buildPrompt();
  $('btnCopy').disabled=false; $('btnEdit').disabled=false;
  setEditing(false);
  showMsg('Prompt generated. Review it, then click Copy Prompt.',true);
};
$('btnEdit').onclick=()=>setEditing(promptEl.readOnly);
$('btnReset').onclick=()=>{
  setDefaults(); suggestFromHR(); promptEl.value=''; setEditing(false); clearMsg();
  $('btnCopy').disabled=true; $('btnEdit').disabled=true;
  document.querySelectorAll('.err').forEach(e=>e.textContent='');
  document.querySelectorAll('.invalid').forEach(e=>e.classList.remove('invalid'));
};
$('btnCopy').onclick=async()=>{
  const text=promptEl.value;
  if(!text.trim()){showMsg('Nothing to copy. Generate a prompt first.',false);return;}
  try{
    if(!(navigator.clipboard&&window.isSecureContext)) throw new Error('no async clipboard');
    await navigator.clipboard.writeText(text);
    showMsg('Copied to clipboard. Paste it into Claude Code.',true);
  }catch(e){
    // Fallback for file:// or restricted contexts
    try{
      const ro=promptEl.readOnly; promptEl.readOnly=false;
      promptEl.focus(); promptEl.select();
      const ok=document.execCommand('copy');
      promptEl.readOnly=ro; promptEl.setSelectionRange(0,0);
      ok?showMsg('Copied to clipboard. Paste it into Claude Code.',true)
        :showMsg('Copy failed. Select the text and press Ctrl+C.',false);
    }catch(e2){ showMsg('Copy failed. Select the text and press Ctrl+C.',false); }
  }
};

// PIN and CS are suggested from HR whenever HR changes; the user can still override them afterwards.
function suggestFromHR(){
  ['PIN','CS'].forEach(k=>{
    $(k+'_d').value=$('HR_d').value;
    $(k+'_s').value=$('HR_s').value;
  });
}
$('HR_d').addEventListener('change',suggestFromHR);
$('HR_s').addEventListener('input',suggestFromHR);

setDefaults();
suggestFromHR();
</script>
</body>
</html>
